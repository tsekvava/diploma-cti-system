version: "3.8"

services:
  # ── Ollama (LLM inference) ──
  ollama:
    image: ollama/ollama:latest
    container_name: cti-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (раскомментировать при наличии NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  # ── CTI Pipeline (Web UI + CLI) ──
  cti-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cti-pipeline
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - cti_data:/app/chroma_db
      - cti_results:/app/batch_results
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  cti_data:
  cti_results:
